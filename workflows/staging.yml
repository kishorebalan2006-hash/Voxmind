name: Staging Deployment

on:
  push:
    branches: [ develop ]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Flutter Staging Web
        working-directory: voxmind
        run: |
          flutter pub get
          flutter build web --dart-define=ENVIRONMENT=staging --no-tree-shake-icons

      - name: Deploy Firebase Staging Rules & Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_STAGING_TOKEN }}
        run: |
          echo "Deploying Staging Firestore & Storage Rules"
          # npx firebase-tools deploy --only firestore:rules,storage --project voxmind-staging --token "$FIREBASE_TOKEN"

      - name: Deploy Backend Container to Staging Cloud Run
        run: |
          echo "Triggering Staging Cloud Run / Container deployment"
